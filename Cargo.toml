[package]
name = "diskdingo"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
plist = { version = "1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
    "Win32_NetworkManagement_WNet",
] }

[profile.release]
strip = true
